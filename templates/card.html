<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ profile.name }} | LabCard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --dynamic-accent: {{ profile.accent_color }};
            --dynamic-font: {{ profile.font_size }}px;
        }

        .profile-card {
            font-size: var(--dynamic-font);
        }

        .dynamic-avatar {
            width: {{ profile.image_size }}px;
            height: {{ profile.image_size }}px;
            border-radius: {{ profile.image_radius }}%;
        }

        .profile-role-badge {
            background-color: var(--dynamic-accent);
        }

        .profile-content a {
            color: var(--dynamic-accent);
        }

        .profile-content blockquote {
            border-left-color: var(--dynamic-accent);
        }
    </style>
</head>
<body class="profile-mode-body">

    <div class="profile-mobile-wrapper">
        <article class="profile-card">

            <div class="profile-hero">
                {% if profile.photo %}
                    <img src="data:image/png;base64,{{ profile.photo }}" class="profile-avatar dynamic-avatar" alt="{{ profile.name }}">
                {% else %}
                    <div class="profile-avatar placeholder dynamic-avatar"></div>
                {% endif %}

                <h1 class="profile-name">{{ profile.name }}</h1>

                {% if profile.role %}
                    <div class="profile-role-badge">{{ profile.role }}</div>
                {% endif %}
            </div>

            <div class="profile-content">
                {{ profile.bio | safe }}
            </div>

            <footer class="profile-mini-footer">
                <span>LabCard</span>
            </footer>

        </article>
    </div>

</body>
</html>
