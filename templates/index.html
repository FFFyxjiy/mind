<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои визитки | LabCard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-bg">

    <nav class="eco-nav">
        <div class="eco-nav-left">
            <div class="eco-pill brand-pill">Card</div>
            <div class="eco-pill">Визитки и биография</div>
        </div>

        <div class="eco-nav-center">
            <form action="https://searcli.com/search" method="GET" target="_blank" class="search-form">
                <input type="text" name="q" class="eco-search" placeholder="Поиск Searcli">
                <button type="submit" class="search-btn">
                    <i class="fa-solid fa-search"></i>
                </button>
            </form>
        </div>

        <div class="eco-nav-right">
            <a href="/editor" class="btn-eco-create" title="Создать визитку"><i class="fa-solid fa-plus"></i></a>

            <div class="eco-pill profile-pill" title="Настройки аккаунта" onclick="window.location.href='https://id.labretto.ru/account'">
                <div class="eco-avatar">
                    <img src="{{ user.avatar_url }}" onerror="this.style.display='none'" alt="">
                </div>
                <span class="eco-username">{{ user.display_name }}</span>
            </div>

            <a href="https://id.labretto.ru/logout" class="btn-logout" title="Выйти из аккаунта">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </a>
        </div>
    </nav>

    <main class="eco-container">
        <div class="projects-grid">

            {% for profile in profiles %}
            <div class="project-card animate-card" style="animation-delay: {{ loop.index0 * 0.1 }}s;">
                <a href="/view/{{ profile.short_id }}" class="project-card-link" target="_blank">
                    {% if profile.photo %}
                        <img src="data:image/png;base64,{{ profile.photo }}" class="project-thumb">
                    {% else %}
                        <div class="project-thumb placeholder"></div>
                    {% endif %}

                    <div class="project-info">
                        <h3>{{ profile.name or 'Без имени' }}</h3>
                        <p>{{ profile.role or 'Описание отсутствует' }}</p>
                    </div>
                </a>

                <form action="/delete/{{ profile.short_id }}" method="POST" class="delete-form" onsubmit="return confirm('Точно удалить эту визитку?');">
                    <button type="submit" class="btn-delete-card" title="Удалить визитку">
                        <img src="{{ url_for('static', path='trach.svg') }}" alt="Удалить">
                    </button>
                </form>
            </div>
            {% else %}
            <div class="empty-state">
                <i class="fa-regular fa-folder-open" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 20px;"></i>
                <h2>У вас пока нет визиток</h2>
                <p>Нажмите «+» в верхнем меню, чтобы создать.</p>
            </div>
            {% endfor %}

        </div>
    </main>

</body>
</html>
